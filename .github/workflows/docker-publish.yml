name: Docker Image CI for MUM

# Builds the Go/SQLite image from deploy/docker/Dockerfile and publishes it to
# ghcr.io/<owner>/mum. Pull requests build without pushing.

on:
  push:
    branches: [ "main" ] # Trigger on push to main branch
    tags:
      - 'v*' # Trigger on version tags like v1.0, v0.2.1
  pull_request:
    branches: [ "main" ] # Build on PRs to main for testing

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # BuildKit is required for the per-Dockerfile ignore file
      # (deploy/docker/Dockerfile.dockerignore) and the GitHub Actions cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # Uses the GitHub username that triggered the action
          password: ${{ secrets.GITHUB_TOKEN }} # Special token provided by GitHub Actions

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mum # github.repository_owner is your username/org
          tags: |
            type=edge,branch=main  # For pushes to main, tag as 'edge'
            type=ref,event=branch  # For pushes to any branch, tag with branch name (e.g., main)
            type=ref,event=tag     # For pushes of tags, use the tag name (e.g., v0.1.0)
            type=ref,event=pr      # For pull requests (built, not pushed)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }} # Tag 'latest' for main branch pushes or version tags

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('edge-{0}', github.sha) }}
          push: ${{ github.event_name != 'pull_request' }} # Only push if not a pull request
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
