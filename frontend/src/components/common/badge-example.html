<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    body {
        background-color: #333C4D;
        display: flex;
        gap: 10px;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        align-items: flex-start;
    }

    .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 16px;
        border: 1.5px solid;
        font-weight: 700;
        font-size: 14px;
        line-height: 1.2;
        text-align: center;
        text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        box-sizing: border-box;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
    }

    /* Badge 1: Services API */
    .services-api {
        background-color: #37483C;
        border-color: #6FA97F;
        color: #CEEAD6;
    }
    .services-api:hover {
        background-color: #465c4d; 
        border-color: #8ac49a;
        color: #e8f7ec;
    }

    /* Badge 2: Plex */
    .plex {
        background-color: #544233;
        border-color: #C68A57;
        color: #FEDFC4;
    }
    .plex:hover {
        background-color: #6b5441; 
        border-color: #e3a671;
        color: #fff0e0;
    }

    /* Badge 3: Torrent */
    .torrent {
        background-color: #473954;
        border-color: #9D7CD8;
        color: #E9D2FD;
    }
    
    .torrent:hover {
        /* Extracted colors from the hover image */
        background-color: #5A4D65;
        border-color: #CB96FA;
        color: #EBD7FD;
    }
</style>
</head>
<body>

    <div class="badge services-api">Services API</div>
    <div class="badge plex">Plex</div>
    <div class="badge torrent">Torrent</div>

</body>
</html>
